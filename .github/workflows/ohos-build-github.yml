# OHOS Bun build on a GitHub-hosted ARM runner using the social4hyq OHOS
# container (Harmonybrew musl userspace). The container provides the full
# OHOS toolchain (llvm@21, ohos-sdk, icu4c@78, rust-nightly, bun-webkit
# bottles) via brew — no self-compiled __n1 cross-libs needed.
#
# Container approach (not GHA `container:` field): the image is a musl
# userspace that doesn't support the glibc node runner GHA requires, so we
# `docker run -d` + `docker exec` (same as social4hyq/homebrew-core).
#
# --webkit=local: we pin our own WebKit fork (not social4hyq bottle) to
# avoid bottle drift (2026-08-03 incident). The container's llvm@21 libcxx
# (__1 ABI) compiles WebKit → __1 WebKit → matches __1 bun.
#
# ABI: container cross-libs are __1 (same as self-hosted Harmonybrew).
# After commit 6269b7c0 (deleted napi_body.rs __n1 branch), C++ __1 + Rust
# __1 (OHOS mod empty, no v8::Array::New reference) → internally consistent
# → runs on device (v8 not exported, device doesn't resolve ABI).

name: OHOS Build (GitHub-hosted, social4hyq container)

on:
  push:
    branches:
      - ohos-aarch64
      - claude/ohos-*
  workflow_dispatch:
    inputs:
      webkit_ref:
        description: 'WebKit fork commit (defaults to pinned WEBKIT_REF)'
        required: false
        default: ''

concurrency:
  group: ohos-build-github-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # social4hyq ci-runner image (GHCR mirror of Harmonybrew SWR image).
  # TODO: digest-pin via vars.OHOS_CI_IMAGE for reproducibility (see
  # social4hyq sync-ci-image.yml). Using :latest for initial bring-up.
  OHOS_CI_IMAGE: ghcr.io/social4hyq/ci-runner:latest
  CONTAINER: ohos
  TAP: social4hyq/core
  BREW_ENV: HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_ENV_HINTS=1
  WEBKIT_FORK: springmin/WebKit
  WEBKIT_REF: c9296e353e365ecf0de82f273bb0a88a3df465be
  RUST_TOOLCHAIN: nightly-2026-07-20
  NINJA_JOBS: 2

jobs:
  build:
    name: Build Bun for OHOS (aarch64, social4hyq container)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout Bun source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Start social4hyq OHOS container ──────────────────────────
      # docker run (not GHA container:) — musl userspace incompatible
      # with GHA's glibc node runner. seccomp=unconfined for io_uring.
      - name: Pull and start OHOS container
        run: |
          docker pull "$OHOS_CI_IMAGE"
          docker run -d --name "$CONTAINER" --init \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/workspace/bun" \
            "$OHOS_CI_IMAGE" sleep infinity

      - name: Configure container (OHOS device paths + cargo + brew trust)
        run: |
          # OHOS device path simulation (binary-sign-tool needs /system/bin/sh etc.)
          docker exec "$CONTAINER" bash -lc \
            'mkdir -p /data/local/tmp /system/bin /system/lib && \
             ln -sf /bin/sh /system/bin/sh && \
             ln -sf /lib/ld-musl-aarch64.so.1 /system/lib/ld-musl-aarch64.so.1'
          # cargo sparse registry + git-fetch-with-cli
          docker exec "$CONTAINER" bash -lc \
            'mkdir -p /root/.cargo && \
             printf "[registries.crates-io]\nprotocol = \"sparse\"\n\n[net]\ngit-fetch-with-cli = true\nretry = 3\n" > /root/.cargo/config.toml'
          # brew trust social4hyq tap
          docker exec "$CONTAINER" bash -lc "brew tap $TAP" || true

      # ── Verify toolchain (preinstalled in ci-runner image) ───────
      # The ci-runner image already has Harmonybrew core bottles installed
      # (llvm@21, ohos-sdk, icu4c@78, rust-nightly, bun-bootstrap, etc).
      # We only verify they exist — no brew install needed.
      - name: Verify container toolchain
        run: |
          docker exec "$CONTAINER" bash -lc '
            echo "=== brew list (key deps) ==="
            brew list --versions llvm@21 ohos-sdk icu4c@78 rust-nightly bun-bootstrap cmake ninja 2>&1
            echo "=== clang ==="
            $(brew --prefix llvm@21)/bin/clang --version | head -1
            echo "=== rustc ==="
            $(brew --prefix rust-nightly)/bin/rustc --version
            echo "=== bun ==="
            $(brew --prefix bun-bootstrap)/bin/bun --version
          '

      # ── WebKit fork (pinned, --webkit=local) ─────────────────────
      - name: Checkout WebKit fork (pinned)
        run: |
          WK_REF="${{ inputs.webkit_ref || env.WEBKIT_REF }}"
          echo "WebKit ref: $WK_REF"
          rm -rf vendor/WebKit
          mkdir -p vendor/WebKit
          cd vendor/WebKit
          git init
          git remote add origin https://github.com/${{ env.WEBKIT_FORK }}.git
          git fetch --depth 1 origin "$WK_REF"
          git checkout FETCH_HEAD
          echo "=== vendor/WebKit HEAD ==="
          git rev-parse HEAD

      - name: Extract WebKit version for cache key
        id: webkit-version
        run: |
          WK_VER=$(grep "^export const WEBKIT_VERSION" scripts/build/deps/webkit.ts | grep -oE '[a-f0-9]{40}')
          echo "version=${WK_VER}" >> "$GITHUB_OUTPUT"

      - name: Cache WebKit build
        uses: actions/cache@v4
        id: webkit-cache
        with:
          path: build/release-ohos/deps/WebKit
          key: webkit-ohos-container-${{ inputs.webkit_ref || env.WEBKIT_REF }}-${{ steps.webkit-version.outputs.version }}-abi-1

      # ── bun install ──────────────────────────────────────────────
      - name: bun install (root + node-fallbacks)
        run: |
          BUN=$(docker exec "$CONTAINER" bash -lc 'brew --prefix bun-bootstrap')/bin/bun
          docker exec "$CONTAINER" bash -lc "cd /workspace/bun && BUN_INSTALL_IGNORE_SCRIPTS=1 $BUN install 2>&1 | tail -20"
          docker exec "$CONTAINER" bash -lc "cd /workspace/bun/src/node-fallbacks && BUN_INSTALL_IGNORE_SCRIPTS=1 $BUN install 2>&1 | tail -20"

      # ── Configure + build ────────────────────────────────────────
      # env mirrors social4hyq bun.rb formula.
      - name: Configure + build Bun for OHOS
        run: |
          set -eo pipefail
          docker exec "$CONTAINER" bash -lc '
            set -eo pipefail
            BREW_PREFIX=$(brew --prefix)
            LLVM_PREFIX=$(brew --prefix llvm@21)
            SDK_PREFIX=$(brew --prefix ohos-sdk)
            ICU_PREFIX=$(brew --prefix icu4c@78)
            RUST_PREFIX=$(brew --prefix rust-nightly)
            BUN=$(brew --prefix bun-bootstrap)/bin/bun

            export PATH="$LLVM_PREFIX/bin:$RUST_PREFIX/bin:$BREW_PREFIX/bin:$PATH"
            export LD_LIBRARY_PATH="$BREW_PREFIX/lib/libxml2/lib:$BREW_PREFIX/lib/zlib/lib:$BREW_PREFIX/opt/openssl@3/lib:$LD_LIBRARY_PATH"
            export CC="$LLVM_PREFIX/bin/clang"
            export CXX="$LLVM_PREFIX/bin/clang++"
            export CARGO_HOME=/root/.cargo
            export RUSTUP_HOME="$RUST_PREFIX"
            export RUSTUP_TOOLCHAIN='"$RUST_TOOLCHAIN"'
            export OHOS_SDK_ROOT="$SDK_PREFIX"
            export OHOS_SYSROOT="$SDK_PREFIX/ohos/native/sysroot"
            export BUN_INSTALL_IGNORE_SCRIPTS=1

            cd /workspace/bun
            echo "=== toolchain ==="
            rustc --version
            cargo --version
            clang --version | head -1
            "$BUN" --version

            echo "=== configure (webkit=local, --configure-only) ==="
            "$BUN" scripts/build.ts \
              --profile=release \
              --os=ohos \
              --arch=aarch64 \
              --webkit=local \
              --build-dir=build/release-ohos \
              --ohos-sdk-root="$OHOS_SDK_ROOT" \
              --ohos-sysroot="$OHOS_SYSROOT" \
              --configure-only 2>&1 | tee /tmp/build.log

            echo "=== configure-WebKit ==="
            ninja -C build/release-ohos configure-WebKit -j1 2>&1 | tee -a /tmp/build.log

            # Patch: -lpthreads -> -lpthread (WebKit CMake FindThreads bug)
            [ -f build/release-ohos/deps/WebKit/build.ninja ] && \
              sed -i "s/-lpthreads/-lpthread/g" build/release-ohos/deps/WebKit/build.ninja

            echo "=== build (ninja bun) ==="
            ninja -C build/release-ohos bun -j'"$NINJA_JOBS"' 2>&1 | tee -a /tmp/build.log
          ' || { echo "=== build failed ==="; exit 1; }

      # ── Copy binary out + verify ─────────────────────────────────
      - name: Copy binary + build log out of container
        run: |
          mkdir -p build/release-ohos
          docker cp "$CONTAINER":/workspace/bun/build/release-ohos/bun build/release-ohos/bun || \
            docker cp "$CONTAINER":/workspace/bun/build/release-ohos/bun-profile build/release-ohos/bun
          docker cp "$CONTAINER":/tmp/build.log /tmp/build.log 2>/dev/null || true

      - name: Verify binary
        run: |
          set -e
          OUT=build/release-ohos/bun
          echo "=== binary ==="
          ls -lh "$OUT"
          file "$OUT"
          file "$OUT" | grep -iqE "ELF.*(arm64|aarch64)" || { echo "ERROR: not ARM64 ELF"; exit 1; }
          echo "=== NEEDED libs ==="
          readelf -d "$OUT" 2>/dev/null | grep NEEDED || true
          # ABI check: container uses __1 cross-libs (same as self-hosted).
          # After 6269b7c0 (deleted __n1 branch), v8::Array::New not referenced
          # → no v8 UND symbols. symbols.dyn local:* → only Bun__dlopen exported.
          echo "=== v8 undefined symbols (want 0) ==="
          readelf --dyn-syms "$OUT" 2>/dev/null | grep -c "_ZN2v8.*UND" || echo "0"
          echo "=== exported symbols (want only Bun__dlopen) ==="
          readelf --dyn-syms "$OUT" 2>/dev/null | grep -E "GLOBAL.*T " | head -5
          echo "=== validation OK ==="

      - name: Prepare github-hosted release asset
        if: success()
        id: gh_release
        run: |
          BIN=build/release-ohos/bun
          test -f "$BIN" || { echo "FATAL: no bun binary to release"; exit 1; }
          VERSION=$(docker exec "$CONTAINER" bash -lc 'brew --prefix bun-bootstrap' 2>/dev/null && echo "1.4.0" || echo "1.4.0")
          COMMIT=$(git rev-parse --short HEAD)
          cp "$BIN" /tmp/bun-ohos-aarch64-github
          echo "asset_path=/tmp/bun-ohos-aarch64-github" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "✅ Release asset: bun-ohos-aarch64-github (@ $COMMIT)"

      - name: Upload binary artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bun-ohos-aarch64
          path: build/release-ohos/bun
          retention-days: 90

      - name: Upload github-hosted binary to ohos-latest release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ohos-latest
          files: ${{ steps.gh_release.outputs.asset_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dump failure diagnostics
        if: failure()
        run: |
          echo "=== context around first FAILED ==="
          docker exec "$CONTAINER" bash -lc \
            'grep -inE "error\[|error:|fatal error|undefined reference|ld: error|FAILED:" /tmp/build.log | head -50' || true
          docker exec "$CONTAINER" bash -lc 'tail -100 /tmp/build.log' || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ohos-build-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7
