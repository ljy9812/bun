# OHOS Bun build on a bare GitHub-hosted ARM runner (no container, no brew).
#
# Decoupled from social4hyq ci-runner container + Harmonybrew bottles. Runs
# directly on ubuntu-24.04-arm, mirroring the self-hosted ohos-build-rust.yml
# approach: glibc Rust host (aarch64-unknown-linux-gnu) + -Zbuild-std cross-
# compile to aarch64-unknown-linux-ohos target. The container was only needed
# to run the musl OHOS Rust host toolchain — self-hosted proves the glibc host
# + cross-compile path works (it never used the OHOS host tarball).
#
# Toolchain:
#   - LLVM 22.1.7 official tarball (full static libs + cmake config, NOT the
#     brew bottle which strips them → find_package(LLVM) FATAL_ERROR)
#   - OHOS SDK sysroot + libcxx-ohos headers from our own release asset
#     (developer.huawei.com needs login; mirrored to ljy9812/bun releases)
#   - Rust nightly gnu host + rust-src + aarch64-unknown-linux-ohos target
#   - Self-compiled __n1 libcxx/libcxxabi/libunwind (device libc++.so is __n1;
#     all prebuilt .a are __h → must build from LLVM source with __n1 ABI)
#   - ICU 78 cross-compiled from source (apt libicu-dev is glibc, wrong target)
#
# V8 ABI fix: the device libc++_shared.so / libv8_shared.so export std::__n1::*
# The self-compiled libcxx uses -DLIBCXX_ABI_NAMESPACE=__n1, so bun C++ symbols
# mangle __n1 and match the device. Verify-binary asserts St4__n1 > 0 and
# St3__h|St3__1 == 0.

name: OHOS Build (GitHub-hosted)

on:
  push:
    branches:
      - ohos-aarch64
      - claude/ohos-*
  workflow_dispatch:
    inputs:
      webkit_ref:
        description: 'WebKit fork commit (defaults to pinned WEBKIT_REF)'
        required: false
        default: ''

concurrency:
  group: ohos-build-github-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "22.1.7"
  LLVM_URL: "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.7/LLVM-22.1.7-Linux-ARM64.tar.xz"
  LLVM_SRC_URL: "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.7/llvm-project-22.1.7.src.tar.xz"
  OHOS_SDK_TARBALL: "ohos-sdk-sysroot-aarch64-api20-6.0.0.47.tar.gz"
  OHOS_SDK_RELEASE: "ohos-build-deps-v6.0.0.47"
  RUST_VER: "nightly-2026-07-20"
  WEBKIT_FORK: springmin/WebKit
  WEBKIT_REF: c9296e353e365ecf0de82f273bb0a88a3df465be
  NINJA_JOBS: 2
  ICU_URL: "https://github.com/unicode-org/icu/releases/download/release-78-3/icu4c-78_3-src.tgz"

jobs:
  build:
    name: Build Bun for OHOS (aarch64, bare runner)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout Bun source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gperf perl python3 ruby \
            libssl-dev libxml2-dev zlib1g-dev \
            ca-certificates curl wget git \
            build-essential clang \
            libncurses-dev

      - name: Cache LLVM 22
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: /opt/llvm-22
          key: llvm-${{ env.LLVM_VERSION }}-linux-arm64-official

      - name: Download and extract LLVM 22
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/llvm-22
          curl -fsSL "$LLVM_URL" -o /tmp/llvm.tar.xz
          sudo tar xf /tmp/llvm.tar.xz -C /opt/llvm-22 --strip-components=1
          rm /tmp/llvm.tar.xz
          # Verify full static libs exist (brew bottle stripped these)
          test -f /opt/llvm-22/lib/libLLVMDemangle.a || { echo "FATAL: libLLVMDemangle.a missing"; exit 1; }
          /opt/llvm-22/bin/clang --version | head -1
          echo "LLVM_PATH=/opt/llvm-22" >> $GITHUB_ENV

      - name: Set LLVM path (cache hit)
        if: steps.llvm-cache.outputs.cache-hit == 'true'
        run: echo "LLVM_PATH=/opt/llvm-22" >> $GITHUB_ENV

      - name: Download and extract OHOS SDK
        run: |
          mkdir -p $GITHUB_WORKSPACE/ohos-sdk
          curl -fsSL \
            "https://github.com/${{ github.repository }}/releases/download/${{ env.OHOS_SDK_RELEASE }}/${{ env.OHOS_SDK_TARBALL }}" \
            -o /tmp/ohos-sdk.tar.gz
          tar xf /tmp/ohos-sdk.tar.gz -C $GITHUB_WORKSPACE/ohos-sdk
          rm /tmp/ohos-sdk.tar.gz
          SYSROOT=$GITHUB_WORKSPACE/ohos-sdk/ohos/native/sysroot
          LIBCXX_OHOS=$GITHUB_WORKSPACE/ohos-sdk/ohos/native/llvm/include/libcxx-ohos/include/c++/v1
          test -d "$SYSROOT" || { echo "FATAL: sysroot missing"; exit 1; }
          test -f "$LIBCXX_OHOS/__config_site" || { echo "FATAL: libcxx-ohos headers missing"; exit 1; }
          grep -q "define _LIBCPP_ABI_NAMESPACE __n1" "$LIBCXX_OHOS/__config_site" || { echo "FATAL: headers not __n1"; exit 1; }
          echo "OHOS SDK OK (ABI __n1)"
          echo "OHOS_SDK_ROOT=$GITHUB_WORKSPACE/ohos-sdk" >> $GITHUB_ENV
          echo "OHOS_SYSROOT=$SYSROOT" >> $GITHUB_ENV

      - name: Install Rust nightly (gnu host + ohos cross-target)
        run: |
          RUST_HOME=$HOME/.rust
          mkdir -p "$RUST_HOME"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
            --default-toolchain "$RUST_VER" \
            --profile minimal \
            --component rust-src \
            --target aarch64-unknown-linux-ohos \
            --prefix "$RUST_HOME"
          echo "RUST_HOME=$RUST_HOME" >> $GITHUB_ENV
          echo "$RUST_HOME/bin" >> $GITHUB_PATH
          source "$RUST_HOME/env"
          rustc --version
          cargo --version
          rustup target list --installed

      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Checkout WebKit fork (pinned)
        run: |
          WK_REF="${{ inputs.webkit_ref || env.WEBKIT_REF }}"
          echo "WebKit ref: $WK_REF"
          rm -rf vendor/WebKit
          mkdir -p vendor/WebKit
          cd vendor/WebKit
          git init
          git remote add origin https://github.com/${{ env.WEBKIT_FORK }}.git
          git fetch --depth 1 origin "$WK_REF"
          git checkout FETCH_HEAD
          echo "=== vendor/WebKit HEAD ==="
          git rev-parse HEAD

      - name: WebKit version sync check
        run: |
          WK_HASH=$(grep "^export const WEBKIT_VERSION" scripts/build/deps/webkit.ts | grep -oE '[a-f0-9]{40}')
          echo "scripts/build/deps/webkit.ts pins: $WK_HASH"
          if git -C vendor/WebKit cat-file -e "${WK_HASH}" 2>/dev/null; then
            echo "vendor/WebKit contains ${WK_HASH}"
          else
            echo "vendor/WebKit missing ${WK_HASH} — fetching from upstream oven-sh/WebKit"
            cd vendor/WebKit
            git remote add upstream https://github.com/oven-sh/WebKit.git 2>/dev/null || true
            git fetch upstream main --depth=200 2>/dev/null || echo "upstream fetch failed (network)"
          fi

      - name: Extract WebKit version for cache key
        id: webkit-version
        run: |
          WK_VER=$(grep "^export const WEBKIT_VERSION" scripts/build/deps/webkit.ts | grep -oE '[a-f0-9]{40}')
          echo "version=${WK_VER}" >> "$GITHUB_OUTPUT"

      - name: Cache WebKit build
        uses: actions/cache@v4
        id: webkit-cache
        with:
          path: build/release-ohos/deps/WebKit
          key: webkit-ohos-github-${{ inputs.webkit_ref || env.WEBKIT_REF }}-${{ steps.webkit-version.outputs.version }}-abi-n1

      - name: Purge stale cross-libs
        run: rm -rf build/ohos-cross-libs

      - name: Cache self-compiled __n1 libcxx
        id: libcxx-cache
        uses: actions/cache@v4
        with:
          path: build/ohos-cross-libs
          key: ohos-libcxx-n1-llvm${{ env.LLVM_VERSION }}

      - name: Self-compile __n1 libcxx + libcxxabi + libunwind
        if: steps.libcxx-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          LLVM=/opt/llvm-22
          SDK=$OHOS_SDK_ROOT
          SYSROOT=$OHOS_SYSROOT
          CROSS=build/ohos-cross-libs
          SRC=/tmp/llvm-project
          RT=$SRC/runtimes

          export PATH="$LLVM/bin:$PATH"

          # Fetch LLVM 22 source (runtimes/ subdirectory)
          if [ ! -d "$RT" ]; then
            echo "=== downloading llvm-project-${LLVM_VERSION} source ==="
            rm -rf "$SRC" /tmp/llvm-src.tar.xz
            curl -fsSL -o /tmp/llvm-src.tar.xz "$LLVM_SRC_URL"
            mkdir -p "$SRC"
            tar xf /tmp/llvm-src.tar.xz -C "$SRC" --strip-components=1
            rm -f /tmp/llvm-src.tar.xz
          fi

          # cflags mirror social4hyq llvm@21.rb build_multiarch_runtimes formula.
          # NO --gcc-toolchain (caused cmake to find wrong llvm cmake config).
          CFLAGS="--target=aarch64-linux-ohos --sysroot=$SYSROOT -D__MUSL__ -I$SYSROOT/usr/include -fPIC -fstack-protector-strong"
          CXXFLAGS_UNWIND="$CFLAGS -nostdinc++"

          # Stage 1: libunwind standalone
          echo "=== Stage 1: libunwind ==="
          BUILD1=/tmp/libcxx-build-unwind
          rm -rf "$BUILD1" && mkdir -p "$BUILD1"
          cmake -S "$RT" -B "$BUILD1" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_RUNTIMES="libunwind" \
            -DCMAKE_C_COMPILER="$LLVM/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM/bin/clang++" \
            -DCMAKE_AR="$LLVM/bin/llvm-ar" \
            -DCMAKE_RANLIB="$LLVM/bin/llvm-ranlib" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS_UNWIND" \
            -DLIBUNWIND_ENABLE_SHARED=OFF \
            -DLIBUNWIND_USE_COMPILER_RT=ON
          ninja -C "$BUILD1"

          # Stage 2: libcxx + libcxxabi + libunwind combined, __n1 ABI
          echo "=== Stage 2: libcxx + libcxxabi + libunwind (ABI __n1) ==="
          BUILD2=/tmp/libcxx-build
          rm -rf "$BUILD2" && mkdir -p "$BUILD2"
          cmake -S "$RT" -B "$BUILD2" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_RUNTIMES="libunwind;libcxxabi;libcxx" \
            -DCMAKE_C_COMPILER="$LLVM/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM/bin/clang++" \
            -DCMAKE_AR="$LLVM/bin/llvm-ar" \
            -DCMAKE_RANLIB="$LLVM/bin/llvm-ranlib" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_CXX_FLAGS="$CFLAGS" \
            -DLIBCXX_ENABLE_SHARED=OFF \
            -DLIBCXXABI_ENABLE_SHARED=OFF \
            -DLIBUNWIND_ENABLE_SHARED=OFF \
            -DLIBCXX_CXX_ABI=libcxxabi \
            -DLIBCXX_ABI_NAMESPACE=__n1 \
            -DLIBCXX_HAS_MUSL_LIBC=ON \
            -DLIBCXX_HAS_PTHREAD_API=ON \
            -DLIBCXXABI_USE_LLVM_UNWINDER=ON \
            -DLIBCXXABI_ENABLE_STATIC_UNWINDER=ON \
            -DLIBCXX_ENABLE_STATIC_ABI_LIBRARY=ON \
            -DLIBCXXABI_STATICALLY_LINK_UNWINDER_IN_STATIC_LIBRARY=OFF \
            -DLIBCXXABI_HAS_CXA_THREAD_ATEXIT_IMPL=OFF \
            -DLIBCXX_USE_COMPILER_RT=ON \
            -DLIBCXXABI_USE_COMPILER_RT=ON \
            -DLIBUNWIND_USE_COMPILER_RT=ON
          ninja -C "$BUILD2" cxx cxxabi unwind

          # Install into cross-libs layout flags.ts expects
          echo "=== install into $CROSS ==="
          mkdir -p "$CROSS/libcxx/include" "$CROSS/libcxxabi/include" "$CROSS/libunwind/include"
          mkdir -p "$CROSS/libcxx/lib" "$CROSS/libcxxabi/lib" "$CROSS/libunwind/lib"
          cp -a "$BUILD2/include/c++/v1" "$CROSS/libcxx/include/v1" 2>/dev/null || \
            cp -a "$LLVM/include/c++/v1" "$CROSS/libcxx/include/v1"
          ln -sfn "$CROSS/libcxx/include/v1" "$CROSS/libcxxabi/include"
          cp "$BUILD2/lib/aarch64-linux-ohos/libc++.a" "$CROSS/libcxx/lib/libc++.a" 2>/dev/null || \
            cp "$BUILD2/lib/libc++.a" "$CROSS/libcxx/lib/libc++.a"
          cp "$BUILD2/lib/aarch64-linux-ohos/libc++abi.a" "$CROSS/libcxxabi/lib/libc++abi.a" 2>/dev/null || \
            cp "$BUILD2/lib/libc++abi.a" "$CROSS/libcxxabi/lib/libc++abi.a"
          cp "$BUILD1/lib/aarch64-linux-ohos/libunwind.a" "$CROSS/libunwind/lib/libunwind.a" 2>/dev/null || \
            cp "$BUILD1/lib/libunwind.a" "$CROSS/libunwind/lib/libunwind.a"

          echo "=== __config_site ABI marker ==="
          grep -nE "_LIBCPP_ABI_NAMESPACE|_LIBCPP_ABI_VERSION" "$CROSS/libcxx/include/v1/__config_site"
          echo "=== .a symbol ABI check ==="
          for a in libc++.a libc++abi.a; do
            lib="$CROSS/libcxx/lib/$a"
            [ -f "$CROSS/libcxxabi/lib/$a" ] && lib="$CROSS/libcxxabi/lib/$a"
            n1=$("$LLVM/bin/llvm-nm" "$lib" 2>/dev/null | grep -c "St4__n1")
            hh=$("$LLVM/bin/llvm-nm" "$lib" 2>/dev/null | grep -c "St3__h")
            echo "$a: __n1=$n1 __h=$hh"
          done

      - name: Cache cross-compiled ICU 78
        id: icu-cache
        uses: actions/cache@v4
        with:
          path: build/ohos-icu
          key: ohos-icu-78-llvm${{ env.LLVM_VERSION }}

      - name: Cross-compile ICU 78 for aarch64-linux-ohos
        if: steps.icu-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          LLVM=/opt/llvm-22
          SYSROOT=$OHOS_SYSROOT
          ICU_SRC=/tmp/icu-src
          ICU_HOST=/tmp/icu-host-build
          ICU_TARGET_DIR=$GITHUB_WORKSPACE/build/ohos-icu/target
          ICU_HOST_DIR=$GITHUB_WORKSPACE/build/ohos-icu/host
          export PATH="$LLVM/bin:$PATH"

          # Download ICU 78 source
          if [ ! -d "$ICU_SRC" ]; then
            curl -fsSL -o /tmp/icu-src.tgz "$ICU_URL"
            mkdir -p "$ICU_SRC"
            tar xzf /tmp/icu-src.tgz -C "$ICU_SRC" --strip-components=1
            rm /tmp/icu-src.tgz
          fi

          # Stage 1: ICU host tools (native linux-gnu for genrb/genccode/gencmn/pkgdata)
          echo "=== Stage 1: ICU host tools ==="
          rm -rf "$ICU_HOST" && mkdir -p "$ICU_HOST"
          cd "$ICU_HOST"
          "$ICU_SRC/source/runConfigureICU" Linux \
            --disable-shared --enable-static \
            --prefix=/tmp/icu-host-install
          make -j$(nproc)
          make install

          # Stage 2: cross-compile ICU for aarch64-linux-ohos
          echo "=== Stage 2: ICU target (aarch64-linux-ohos) ==="
          ICU_TARGET=/tmp/icu-target-build
          rm -rf "$ICU_TARGET" && mkdir -p "$ICU_TARGET"
          cd "$ICU_TARGET"
          TARGET_CFLAGS="--target=aarch64-linux-ohos --sysroot=$SYSROOT -D__MUSL__ -I$SYSROOT/usr/include -fPIC"
          CROSS_LIBS=$GITHUB_WORKSPACE/build/ohos-cross-libs
          TARGET_CXXFLAGS="$TARGET_CFLAGS -nostdinc++ -I$CROSS_LIBS/libcxx/include/v1 -I$CROSS_LIBS/libcxxabi/include"
          "$ICU_SRC/source/configure" \
            --host=aarch64-linux-ohos \
            --prefix=/tmp/icu-target-install \
            --disable-shared --enable-static \
            --with-cross-build=/tmp/icu-host-install \
            CC="$LLVM/bin/clang" CXX="$LLVM/bin/clang++" \
            CFLAGS="$TARGET_CFLAGS" CXXFLAGS="$TARGET_CXXFLAGS" \
            LDFLAGS="--target=aarch64-linux-ohos --sysroot=$SYSROOT" \
            --disable-layout --disable-layoutex \
            --with-data-packaging=static
          make -j$(nproc)
          make install

          # Install into layout flags.ts expects
          mkdir -p "$ICU_TARGET_DIR/include" "$ICU_TARGET_DIR/lib" "$ICU_HOST_DIR/bin"
          cp -a /tmp/icu-target-install/include/unicode "$ICU_TARGET_DIR/include/unicode"
          for a in libicudata.a libicui18n.a libicuuc.a; do
            cp /tmp/icu-target-install/lib/$a "$ICU_TARGET_DIR/lib/"
          done
          for t in genrb genccode gencmn pkgdata; do
            cp /tmp/icu-host-install/bin/$t "$ICU_HOST_DIR/bin/" 2>/dev/null || true
          done
          echo "=== ICU target libs ==="
          ls -lh "$ICU_TARGET_DIR/lib/"

      - name: Verify cross-libs + ICU
        run: |
          set -e
          LLVM=/opt/llvm-22
          CROSS=build/ohos-cross-libs
          ICU=build/ohos-icu/target
          test -f "$CROSS/libcxx/include/v1/__config_site" || { echo "ERROR: cross-libs headers missing"; exit 1; }
          test -f "$CROSS/libcxx/lib/libc++.a" || { echo "ERROR: libc++.a missing"; exit 1; }
          grep -q "define _LIBCPP_ABI_NAMESPACE __n1" "$CROSS/libcxx/include/v1/__config_site" || { echo "ERROR: headers not __n1"; exit 1; }
          test -f "$ICU/lib/libicuuc.a" || { echo "ERROR: ICU libs missing"; exit 1; }
          echo "=== cross-libs OK (ABI __n1) + ICU OK ==="

      - name: bun install (root)
        run: |
          bun install 2>&1 | tail -20
          test -x node_modules/.bin/esbuild && echo "esbuild OK" || { echo "ERROR: esbuild missing"; exit 1; }

      - name: bun install (src/node-fallbacks)
        run: |
          cd src/node-fallbacks
          bun install 2>&1 | tail -20
          test -x node_modules/.bin/esbuild && echo "node-fallbacks esbuild OK" || { echo "ERROR: node-fallbacks esbuild missing"; exit 1; }

      - name: Configure + build Bun for OHOS
        run: |
          set -eo pipefail
          LLVM=/opt/llvm-22
          SDK=$OHOS_SDK_ROOT
          SYSROOT=$OHOS_SYSROOT
          RUST_HOME=$HOME/.rust

          export PATH="$RUST_HOME/bin:$LLVM/bin:$HOME/.bun/bin:$PWD/.bin:$PATH"
          export CC="$LLVM/bin/clang"
          export CXX="$LLVM/bin/clang++"
          export CARGO_HOME="$RUST_HOME/cargo"
          export RUSTUP_HOME="$RUST_HOME"
          export RUSTUP_TOOLCHAIN="$RUST_VER"
          export OHOS_SDK_ROOT="$SDK"
          export OHOS_SYSROOT="$SYSROOT"
          export BUN_INSTALL_IGNORE_SCRIPTS=1
          mkdir -p .bin && ln -sf "$LLVM/bin/llvm-strip" .bin/strip

          BUN_BIN="$HOME/.bun/bin/bun"
          echo "=== toolchain ==="
          rustc --version
          cargo --version
          clang --version | head -1
          "$BUN_BIN" --version

          echo "=== configure (webkit=local, --configure-only) ==="
          "$BUN_BIN" scripts/build.ts \
            --profile=release \
            --os=ohos \
            --arch=aarch64 \
            --webkit=local \
            --build-dir=build/release-ohos \
            --ohos-sdk-root="$SDK" \
            --ohos-sysroot="$SYSROOT" \
            --configure-only 2>&1 | tee /tmp/build.log

          echo "=== configure-WebKit ==="
          ninja -C build/release-ohos configure-WebKit -j1 2>&1 | tee -a /tmp/build.log

          # Patch #2: -lpthreads -> -lpthread (WebKit CMake FindThreads bug)
          if [ -f build/release-ohos/deps/WebKit/build.ninja ]; then
            sed -i "s/-lpthreads/-lpthread/g" build/release-ohos/deps/WebKit/build.ninja
          fi

          # Patch #1: dep_host_cc -> /usr/bin/clang (LLVM 22 cant find GCC runtime)
          if grep -q "llvm-22/bin/clang \$flags -o \$out \$in" build/release-ohos/build.ninja 2>/dev/null; then
            sed -i 's|command = .*/llvm-22/bin/clang $flags -o $out $in|command = /usr/bin/clang $flags -o $out $in|' \
              build/release-ohos/build.ninja
            echo "patched dep_host_cc"
          fi

          # Patch #3: Rust host linker -> /usr/bin/clang++ (LLVM 22 cant find -lgcc_s)
          if [ -f .cargo/config.toml ] && grep -q 'aarch64-unknown-linux-gnu' .cargo/config.toml; then
            python3 -c "
          import re
          with open('.cargo/config.toml', 'r') as f:
              content = f.read()
          content = re.sub(
              r'\[target\.aarch64-unknown-linux-gnu\]\nlinker = \"[^\"]*\"',
              '[target.aarch64-unknown-linux-gnu]\nlinker = \"/usr/bin/clang++\"',
              content
          )
          with open('.cargo/config.toml', 'w') as f:
              f.write(content)
          print('patched Rust host linker')
          " || echo "could not patch .cargo/config.toml"
          fi

          echo "=== build (ninja bun, -j${{ env.NINJA_JOBS }}) ==="
          set +e
          ninja -C build/release-ohos bun -j${{ env.NINJA_JOBS }} 2>&1 | tee -a /tmp/build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "=== build failed (rc=$rc) ==="
            grep -inE "error\[|error:|fatal error|undefined reference|ld: error|FAILED:" /tmp/build.log | head -50
            tail -60 /tmp/build.log
            exit 1
          fi
        env:
          CI: true

      - name: Verify binary
        run: |
          set -e
          LLVM=/opt/llvm-22
          OUT=build/release-ohos/bun
          [ -f "$OUT" ] || OUT=build/release-ohos/bun-profile
          echo "=== binary ==="
          ls -lh "$OUT"
          file "$OUT"
          file "$OUT" | grep -iqE "ELF.*(arm64|aarch64)" || { echo "ERROR: not an ARM64 ELF"; exit 1; }
          echo "=== NEEDED libs ==="
          readelf -d "$OUT" 2>/dev/null | grep NEEDED || true
          echo "=== C++ ABI namespace (must be __n1; __h/__1 fails on device) ==="
          NM="$LLVM/bin/llvm-nm"
          SYMS=$("$NM" "$OUT" 2>/dev/null)
          if [ -z "$SYMS" ]; then
            echo "(binary symtab empty — checking object files)"
            OBJ_DIR=$(find build/release-ohos -type d -name obj 2>/dev/null | head -1)
            SYMS=$(find "$OBJ_DIR" -name "*.o" -print0 2>/dev/null | xargs -0 "$NM" 2>/dev/null)
          fi
          n1=$(printf "%s\n" "$SYMS" | grep -c "St4__n1")
          bad=$(printf "%s\n" "$SYMS" | grep -cE "St3__h|St3__1")
          echo "std::__n1 symbols: $n1  (want > 0)"
          echo "std::__h/__1 symbols: $bad  (want 0)"
          [ "$n1" -gt 0 ] && [ "$bad" -eq 0 ] || {
            echo "ERROR: C++ ABI mismatch — __n1=$n1 __h/__1=$bad"
            [ "$bad" -gt 0 ] && { echo "--- first offending symbols ---"; printf "%s\n" "$SYMS" | grep -E "St3__h|St3__1" | head -10; }
            exit 1
          }
          echo "=== validation OK ==="

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bun-ohos-aarch64
          path: build/release-ohos/bun
          retention-days: 90

      - name: Dump failure diagnostics
        if: failure()
        run: |
          echo "=== context around first FAILED ==="
          line=$(grep -n "FAILED:" /tmp/build.log 2>/dev/null | head -1 | cut -d: -f1)
          if [ -n "$line" ]; then
            echo "FAILED at line $line"
            sed -n "$((line-30)),$((line+5))p" /tmp/build.log 2>/dev/null
          else
            echo "no FAILED line found"
          fi
          echo "=== last 100 lines ==="
          tail -100 /tmp/build.log 2>/dev/null || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ohos-build-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7
